[build]
  publish = "."

# /journey.html was live for a while before the two layouts moved onto the index.
# Anyone holding that link lands on the same content rather than a 404.
[[redirects]]
  from = "/journey.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/journey"
  to = "/"
  status = 301
  force = true


# The data files moved from the web root into /data/ when the repo was tidied. These
# URLs were published in llms.txt, in the sitemap and in the README before that, and a
# route template whose whole point is being fetched by other people cannot afford to
# 404 a link it advertised. 301, so a crawler that already has the old URL learns the
# new one rather than following the redirect forever.
[[redirects]]
  from = "/template.json"
  to = "/data/template.json"
  status = 301

[[redirects]]
  from = "/template-notes.json"
  to = "/data/template-notes.json"
  status = 301

[[redirects]]
  from = "/route.json"
  to = "/data/route.json"
  status = 301

[[redirects]]
  from = "/research.json"
  to = "/data/research.json"
  status = 301

[[redirects]]
  from = "/k2k.json"
  to = "/data/k2k.json"
  status = 301

[[redirects]]
  from = "/basemap.json"
  to = "/data/basemap.json"
  status = 301

[[redirects]]
  from = "/manifest.json"
  to = "/data/manifest.json"
  status = 301

[[redirects]]
  from = "/api.json"
  to = "/data/api.json"
  status = 301

[[redirects]]
  from = "/tags.json"
  to = "/data/tags.json"
  status = 301

# ORDER MATTERS. When several [[headers]] blocks match the same request, Netlify
# applies them in file order and the LAST one wins for any header they both set.
# The catch-all therefore has to come FIRST. When it sat at the bottom it silently
# overrode every rule below, so /media/* was being served at max-age=3600 instead of
# the intended immutable year, and manifest.json at 3600 instead of 300.

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "*"
    Cache-Control = "public, max-age=3600"

# --- data endpoints: regenerated whenever media changes, so keep them short-lived ---

[[headers]]
  for = "/data/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/template.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/template-notes.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/api.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/route.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/data/tags.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Country outlines only change if the source data is swapped out
[[headers]]
  for = "/data/basemap.json"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --- images under /assets: the hero and the icons, on every page view. A day in
# cache plus a week of stale-while-revalidate, so a repeat visit on a slow
# connection pays nothing and a replaced image under the same name still reaches
# everyone within a day. NOT immutable, for exactly that replaceability. The two
# script rules below come after this block, so they keep their shorter life. ---

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# --- shared page scripts: loaded by both index.html and booklet.html, so a fix to
# either one has to reach two pages. Short-lived like the data they render, rather
# than left on the catch-all's hour. ---

[[headers]]
  for = "/assets/atlas.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/assets/costs.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

# --- pages ---

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# --- the crawler-facing front door: robots.txt, the sitemap, and llms.txt.
# Written by build-seo.cjs from the same data files as the pages, so they move when
# the data does and get the same short life. llms.txt is served as markdown rather
# than as text/plain: the convention at llmstxt.org is a markdown document, and a
# client that respects the type gets the headings and the links as structure. ---

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# --- media: filenames are immutable Instagram IDs, so cache them for a year.
# This is the rule that matters for bandwidth: ~800MB of video on a 100GB/month
# allowance. At max-age=3600 every repeat visitor re-downloaded everything. ---

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ...except these eight. media/research/fig-01.jpg through fig-08.jpg are other
# people's photographs, reproduced with credit. Their names are sequential rather
# than content-addressed and they are referenced with no hash and no query, so
# replacing a plate reuses its filename. A year of `immutable` would mean a
# correction, a re-credit or a takedown could not reach a returning visitor at all.
# An hour is the price of being able to withdraw someone else's picture.
#
# This MUST stay BELOW /media/* (see ORDER MATTERS, above: the last matching block
# wins). Moved above it, this rule is silently overridden and does nothing.
[[headers]]
  for = "/media/research/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
